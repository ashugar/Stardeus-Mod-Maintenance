name: Prepare mod release

on:
  workflow_dispatch:
    inputs:
      mod:
        description: Exact mod folder from MODS.md
        required: true
        type: string
      reviewed_commit:
        description: Independently reviewed full main commit; must match this run
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify the selected trusted main revision
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          if ($env:REVIEWED_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or $env:REVIEWED_COMMIT -cne $env:DISPATCH_COMMIT) {
            throw 'Use an independently reviewed current main commit matching the selected workflow revision.'
          }
      - name: Check out the exact main revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the release privacy checker SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Fetch only the selected main ancestry
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          $shallow = (& git rev-parse --is-shallow-repository).Trim()
          if ($LASTEXITCODE -ne 0 -or $shallow -notin @('true', 'false')) { throw 'Cannot establish graph completeness.' }
          [string[]]$depthArguments = if ($shallow -eq 'true') { @('--unshallow') } else { @() }
          & git -c credential.helper= fetch --no-tags --no-recurse-submodules @depthArguments origin $env:REVIEWED_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Selected main ancestry fetch failed.' }
      - name: Prepare reviewed payload and verify release contents
        env:
          MOD_FOLDER: ${{ inputs.mod }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          & pwsh -NoProfile -File ./build/ModMaintenance/New-ModRelease.ps1 -Mod $env:MOD_FOLDER -ReviewedCommit $env:REVIEWED_COMMIT -OutputRoot (Join-Path $env:RUNNER_TEMP 'stardeus-prepared')
          if ($LASTEXITCODE -ne 0) { throw 'Release preparation failed; no artifact will be uploaded.' }
      - name: Upload prepared files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-mod-release
          path: ${{ runner.temp }}/stardeus-prepared/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
